## Diff
"diff.plus" = "autumnGreen"
"diff.minus" = "autumnRed"
"diff.delta" = "autumnYellow"

## Syntax highlighting - Alabaster-inspired minimal highlighting
# Green - Strings
"string" = "springGreen"
"string.regexp" = "springGreen"
"string.special.url" = "springGreen"
"string.special.symbol" = "oniViolet"

# Purple - Constants (numbers, booleans, symbols)
"constant" = "oniViolet"
"constant.numeric" = "oniViolet"
"constant.character.escape" = "oniViolet"

# Yellow + Bold - Comments
"comment" = { fg = "carpYellow", modifiers = ["bold"] }

# Blue - Definitions (functions, classes, constructors)
"function" = "crystalBlue"
"constructor" = "crystalBlue"

# White/Default - Everything else (not highlighted)
"attribute" = "fujiWhite"
"type" = "fujiWhite"
"type.builtin" = "fujiWhite"
"variable" = "fujiWhite"
"variable.builtin" = "fujiWhite"
"variable.parameter" = "fujiWhite"
"variable.other.member" = "fujiWhite"
"label" = "fujiWhite"
"keyword" = "fujiWhite"
"keyword.control.return" = "fujiWhite"
"keyword.control.exception" = "fujiWhite"
"keyword.directive" = "fujiWhite"
"function.builtin" = "fujiWhite"
"function.macro" = "fujiWhite"
"tag" = "fujiWhite"
"namespace" = "fujiWhite"
"special" = "fujiWhite"

# Gray - Punctuation and operators
"punctuation" = "fujiGray"
"operator" = "fujiGray"

