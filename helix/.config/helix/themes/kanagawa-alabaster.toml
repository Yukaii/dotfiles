# Kanagawa Alabaster
# Kanagawa color palette with Alabaster highlighting philosophy
# Based on: https://tonsky.me/blog/syntax-highlighting/
# Minimal highlighting focused on: strings, constants, comments, and top-level definitions

# Alabaster highlighting principles:
# Only 4 highlighting categories:
# 1. Green - Strings
# 2. Purple - Statically known constants (numbers, booleans, symbols)
# 3. Yellow + Bold - Comments (highlighted, not hidden)
# 4. Blue - Global definitions (functions, classes, constructors)
#
# What's NOT highlighted (white/default):
# - Control keywords (if, else, for, while, function, class, return)
# - Variables, types, attributes
# - Function calls (including builtins)
# - Operators (grayed out for punctuation)

