"$schema" = 'https://starship.rs/config-schema.json'

# Window status style source for `tmuxship apply`.
# tmux renders window index/name with #I/#W; tmuxship reads these styles.
format = "$custom"
right_format = ""
add_newline = false

[custom.window_active]
shell = "bash"
when = 'test "${TMUX_WINDOW_ACTIVE:-0}" = "1"'
command = '''printf "#%s %s " "${TMUX_WINDOW_INDEX:-?}" "${TMUX_WINDOW_NAME:-?}"'''
format = "[$output]($style)"
style = "fg:#BFBDB6 bold"

[custom.window_inactive]
shell = "bash"
when = 'test "${TMUX_WINDOW_ACTIVE:-0}" != "1"'
command = '''printf "#%s %s " "${TMUX_WINDOW_INDEX:-?}" "${TMUX_WINDOW_NAME:-?}"'''
format = "[$output]($style)"
style = "fg:#475266"

[custom.window_zoom]
shell = "bash"
when = 'test "${TMUX_WINDOW_ZOOMED_FLAG:-0}" = "1"'
command = '''printf "󰊓 "'''
format = "[$output]($style)"
style = "fg:#39BAE6"
