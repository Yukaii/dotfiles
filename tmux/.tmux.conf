# Modified from https://github.com/tony/tmux-config

set-option -g default-shell /opt/homebrew/bin/fish
set-option -g mouse on
set-option -g history-limit 100000
set -s set-clipboard on
set -g detach-on-destroy on

set-option -g status-position top
set -g allow-passthrough on

set-option -g prefix C-q
bind-key C-q last-window

set -g extended-keys on
set -g extended-keys-format csi-u

# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Allows for faster key repetition
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize off

# Allows us to use prefix a <command> to send commands to a TMUX session inside
# another TMUX session
bind-key x send-prefix
bind-key C-x send-prefix

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane swith
bind C-p prev
bind C-n next

# set to main-horizontal, 60% height for main pane
bind m set-window-option main-pane-height 60\; select-layout main-horizontal

# Toggle a persistent panel in the current window/session
bind-key b run-shell -b "tsm panel toggle --direction bottom"
bind-key "(" run-shell -b "tsm panel toggle --direction left"
bind-key ")" run-shell -b "tsm panel toggle --direction right"

bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# reload config
bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Pop out current window into an external Ghostty window
bind-key G run-shell -b "tmux-popout-ghostty"
# Kill popout session for current window
bind-key g run-shell -b "tmux-popout-ghostty --kill"

# Clear history
bind M-l clear-history

bind-key -n End select-window -t :$

# Attach to sessions
bind-key r run-shell "echo $(tsm list | fzf-tmux -p 55%,60% \
  --no-sort --border-label ' Tmux session manager ' \
  --layout=reverse \
  --border=none \
  --prompt 'session > ' \
  --pointer '>' \
  --bind 'enter:execute(tmux switch-client -t {})+abort'\
  --bind 'ctrl-x:execute(tsm kill {})+reload(tsm list)'\
) > /dev/null"

# Keyroute tmux session slots. Prefix y enters a quiet numeric switch table.
bind-key y switch-client -T keyroute-switch
bind-key -T keyroute-switch 1 run-shell -b "keyroute --quiet key tmux 1"
bind-key -T keyroute-switch 2 run-shell -b "keyroute --quiet key tmux 2"
bind-key -T keyroute-switch 3 run-shell -b "keyroute --quiet key tmux 3"
bind-key -T keyroute-switch 4 run-shell -b "keyroute --quiet key tmux 4"
bind-key -T keyroute-switch 5 run-shell -b "keyroute --quiet key tmux 5"
bind-key -T keyroute-switch 6 run-shell -b "keyroute --quiet key tmux 6"
bind-key -T keyroute-switch 7 run-shell -b "keyroute --quiet key tmux 7"
bind-key -T keyroute-switch 8 run-shell -b "keyroute --quiet key tmux 8"
bind-key -T keyroute-switch 9 run-shell -b "keyroute --quiet key tmux 9"
bind-key -T keyroute-switch w run-shell -b "keyroute --quiet profile set work && tmux display-message 'Keyroute profile: work'"
bind-key -T keyroute-switch p run-shell -b "keyroute --quiet profile set personal && tmux display-message 'Keyroute profile: personal'"
bind-key -T keyroute-switch s run-shell -b "tmux display-message \"Keyroute profile: $(keyroute profile current 2>/dev/null || echo none)\""

bind-key M run-shell "tsm move-window"

# tsm worktree controls
# Use run-shell with cd to set working directory
bind-key w run-shell 'cd "#{pane_current_path}" && tsm worktree 2>/tmp/tsm_error.log'
bind-key N run-shell 'cd "#{pane_current_path}" && tsm worktree next'
bind-key P run-shell 'cd "#{pane_current_path}" && tsm worktree prev'

# tmux fzf pane
bind C-w display-popup -h 75% -w 75% -E "\
    tmux list-panes -a -F '#{session_name}:#{window_name} #{pane_id}' |\
    fzf --reverse --header 'switch to pane' --preview 'tmux capture-pane -ep -pt {2} && tmux show-buffer && tmux delete-buffer' --preview-window=up:80%:wrap |\
    awk '{print $2}' |\
    xargs -I {} tmux switch-client -t {}"

# auto window rename
set-window-option -g automatic-rename

# color
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

bind-key "T" display-popup -h 60% -w 55% -E "sesh picker -i"

# default copy not to quit
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "copy_to_clipboard"
bind-key -T copy-mode-vi Y send-keys -X copy-pipe "copy_to_clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe "copy_to_clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "copy_to_clipboard"

# https://github.com/edkolev/dots/blob/master/tmux.conf
# Updates for tmux 1.9's current pane splitting paths.

# from powerline
run-shell "tmux set-environment -g TMUX_VERSION_MAJOR $(tmux -V | cut -d' ' -f2 | cut -d'.' -f1 | sed 's/[^0-9]*//g')"
run-shell "tmux set-environment -g TMUX_VERSION_MINOR $(tmux -V | cut -d' ' -f2 | cut -d'.' -f2 | sed 's/[^0-9]*//g')"

# Vi copypaste mode
set-window-option -g mode-keys vi
if-shell "test '\( #{$TMUX_VERSION_MAJOR} -eq 2 -a #{$TMUX_VERSION_MINOR} -ge 4 \)'" 'bind-key -Tcopy-mode-vi v send -X begin-selection; bind-key -Tcopy-mode-vi y send -X copy-selection-and-cancel'
if-shell '\( #{$TMUX_VERSION_MAJOR} -eq 2 -a #{$TMUX_VERSION_MINOR} -lt 4\) -o #{$TMUX_VERSION_MAJOR} -le 1' 'bind-key -t vi-copy v begin-selection; bind-key -t vi-copy y copy-selection'

# status bar
if-shell '\( #{$TMUX_VERSION_MAJOR} -eq 2 -a #{$TMUX_VERSION_MINOR} -lt 2\) -o #{$TMUX_VERSION_MAJOR} -le 1' 'set-option -g status-utf8 on'

# rm mouse mode fail
if-shell '\( #{$TMUX_VERSION_MAJOR} -eq 2 -a #{$TMUX_VERSION_MINOR} -ge 1\)' 'set -g mouse off'
if-shell '\( #{$TMUX_VERSION_MAJOR} -eq 2 -a #{$TMUX_VERSION_MINOR} -lt 1\) -o #{$TMUX_VERSION_MAJOR} -le 1' 'set -g mode-mouse off'

# Floating term
bind "'" if-shell "[[ $(tmux display-message -p '#S') = floating* ]]" {
    detach-client
} {
  run-shell "tsm popup"
}

# ccmux
bind-key -n M-p display-popup -E -B -w 80% -h 75% "ccmux picker"

# termscope — open files/links visible on screen
set -g @termscope "$HOME/.tmux/plugins/termscope/termscope"

# Plugin options
# set -g @tmux_power_theme 'snow'
set -g @continuum-restore 'on'
set -g @continuum-boot-options 'alacritty'
set -g @resurrect-processes 'ssh kak btop "~pm2" iamb lazygit mosh bun'

# Catpuccin plugin options
# set -g status-right-length 100
# set -g @catppuccin_flavor 'mocha'
# set -g status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_date_time}"
# set -agF status-right "#{E:@catppuccin_status_battery}"
# set -gF status-left ""
# set -g @catppuccin_date_time_text " %H:%M:%S"
# set -ogq @catppuccin_window_current_text " #W@#{b:pane_current_path}"
# set -ogq @catppuccin_window_text " #W"

# tmux dotbar
set -g @tmux-dotbar-position top
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg "#727169"
set -g @tmux-dotbar-fg-current "#dcd7ba"
set -g @tmux-dotbar-fg-session "#c8c093"
set -g @tmux-dotbar-fg-prefix "#7fb4ca"

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'wfxr/tmux-power'
# set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-pain-control'
# set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'eduwass/tmux-palette'
set -g @plugin 'IngoMeyer441/tmux-easy-motion'
set -g @plugin 'iurysza/termscope'

# Other overrides
set -gF popup-style "bg=default"

set -g status-style "default"

set-option -g popup-border-lines rounded
set-option -g popup-border-style "fg=#565B66"

# Pane borders matching Kanagawa theme
set-option -g pane-border-style "fg=#2A2A37"
set-option -g pane-active-border-style "fg=#7FB4CA"

# tmuxship statusline
set -g status-left-length 100
set -g status-right-length 200
set -g status on
set -g status-justify centre
set -g status-interval 60

# Set config paths as global env vars
setenv -g TMUX_SHIP_LEFT_CONFIG   "$HOME/.tmux/starship.toml"
setenv -g TMUX_SHIP_RIGHT_CONFIG  "$HOME/.tmux/.right.toml"
setenv -g TMUX_SHIP_CENTER_CONFIG "$HOME/.tmux/.center.toml"
setenv -g TMUX_SHIP_WINDOW_SEPARATOR " • "

# Generate status-left, status-right, and window status options.
# tmux renders native values such as #S/#I/#W; tmuxship supplies styles.
run-shell 'tmuxship apply'

# Let tmux send terminal focus events so hooks below fire
set -g focus-events on

# Refresh status on events
set-hook -g client-session-changed 'refresh-client -S'
set-hook -g pane-focus-in          'refresh-client -S'

# Window status formats are generated by tmuxship apply.
set -g window-status-style "bg=default,fg=default"

run '~/.tmux/plugins/tpm/tpm'
