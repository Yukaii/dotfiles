add_newline = false
format = """\
${custom.kakcursor}  \
${custom.kakposition}  \
${custom.kakmode}\
${custom.kakcontext} \
${custom.kaklsp_modeline}\
${custom.kakfile}\
${custom.kakfiletype} \
$git_branch\
$git_status\
${custom.kaklsp_err}\
${custom.kaklsp_warn}\
${custom.kaklsp_hint}\
${custom.kaklsp_progress} \
${custom.kaktime}\
"""

[time]
format = "[at](bold white) [$time](dimmed white)"
time_format = "%-l:%M %p"
use_12hr = true
disabled = false

[git_branch]
format = "[ ](bold white) [ $branch]($style)"
style = '#BFA8BF'
truncation_length = 20
truncation_symbol = '…'
only_attached = false
always_show_remote = false
disabled = false

[git_status]
format = '[\[$all_status$ahead_behind\]]($style) '
style = 'bright-red'
stashed = '\$'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
conflicted = '='
deleted = '✘'
renamed = '»'
modified = '!'
staged = '+'
untracked = '?'
disabled = false


[custom.kakfile]
description = 'The current Kakoune buffername'
format = '[ ](bold white) [$output]($style)'
style = '#BFA8BF bold'
command = '''
filename="${kak_buffile##*/}"
extension="${filename##*.}"
case "$extension" in
    js|mjs|cjs) icon="" ;;
    ts|tsx) icon="" ;;
    py) icon="" ;;
    rs) icon="" ;;
    go) icon="󰟓" ;;
    rb) icon="" ;;
    php) icon="" ;;
    java) icon="" ;;
    c|h) icon="" ;;
    cpp|cc|cxx|hpp) icon="" ;;
    md) icon="" ;;
    json) icon="" ;;
    yml|yaml) icon="" ;;
    toml) icon="" ;;
    xml) icon="󰗀" ;;
    html) icon="" ;;
    css) icon="" ;;
    sh|bash|zsh) icon="" ;;
    vim) icon="" ;;
    lua) icon="" ;;
    sql) icon="" ;;
    docker*|Dockerfile) icon="" ;;
    git*) icon="" ;;
    *) icon="󰦨" ;;
esac
printf "%s %s" "$icon" "$filename"
'''
when = 'true'
shell = ['sh']
disabled = false

[custom.kakcursor]
description = 'The current Kakoune cursor position'
format = '[%val{cursor_line}:%val{cursor_char_column}]($style)'
style = 'light-white'
when = ''
shell = ['true']
disabled = false

[custom.kakmode]
description = 'The current Kakoune mode'
format = '{{mode_info}}'
when = ''
shell = ['true']
disabled = false

[custom.kakcontext]
description = 'The current Kakoune context'
format = '{{context_info}}'
when = ''
shell = ['true']
disabled = false

[custom.kakfiletype]
description = 'The current buffer filetype'
format = '\[%opt{filetype}\] '
when = ''
shell = ['true']
disabled = true

[custom.kakposition]
description = 'Relative position of the cursor inside the buffer'
format = '[$output]($style)'
style = 'dimmed white'
command = '''
percent=$(($kak_cursor_line * 100 / $kak_buf_line_count))
if [ "$percent" -eq 0 ]; then
    printf "󰝦 "
elif [ "$percent" -lt 10 ]; then
    printf "󰪞 %s%%" "$percent"
elif [ "$percent" -lt 20 ]; then
    printf "󰪟 %s%%" "$percent"
elif [ "$percent" -lt 30 ]; then
    printf "󰪠 %s%%" "$percent"
elif [ "$percent" -lt 40 ]; then
    printf "󰪡 %s%%" "$percent"
elif [ "$percent" -lt 50 ]; then
    printf "󰪢 %s%%" "$percent"
elif [ "$percent" -lt 60 ]; then
    printf "󰪣 %s%%" "$percent"
elif [ "$percent" -lt 70 ]; then
    printf "󰪤 %s%%" "$percent"
elif [ "$percent" -lt 80 ]; then
    printf "󰪥 %s%%" "$percent"
elif [ "$percent" -lt 90 ]; then
    printf "󰪦 %s%%" "$percent"
elif [ "$percent" -lt 100 ]; then
    printf "󰪧 %s%%" "$percent"
else
    printf "󰝨 "
fi
'''
when = '[ -n "$kak_cursor_line" ]'
shell = ['sh']
disabled = false

[custom.kaktime]
description = "Time segment using kakoune evaluation"
format = "[at](bold white) [%sh{date +\"%-l:%M %p\"}]($style)"
style = "dimmed white"
when = ''
shell = ['true']
disabled = false

[custom.kaklsp_err]
description = "Show errors number from kak-lsp if any"
format = "[ %opt{lsp_diagnostic_error_count}]($style)"
style = "bright-red"
when = '[ -n "$kak_opt_lsp_diagnostic_error_count" -a "$kak_opt_lsp_diagnostic_error_count" -ne 0 ]'
shell = ['sh']
disabled = false

[custom.kaklsp_warn]
description = "Show warnings number from kak-lsp if any"
format = "[ %opt{lsp_diagnostic_warning_count}]($style)"
style = "yellow"
when = '[ -n "$kak_opt_lsp_diagnostic_warning_count" -a "$kak_opt_lsp_diagnostic_warning_count" -ne 0 ]'
shell = ['sh']
disabled = false

[custom.kaklsp_hint]
description = "Show hints number from kak-lsp if any"
format = "[ﯦ %opt{lsp_diagnostic_hint_count}]($style)"
style = "cyan"
when = '[ -n "$kak_opt_lsp_diagnostic_hint_count" -a "$kak_opt_lsp_diagnostic_hint_count" -ne 0 ]'
shell = ['sh']
disabled = false

[custom.kaklsp_progress]
description = "Show activity of kak-lsp if any"
format = "[]($style)"
style = "dimmed white"
when = '[ -n "$kak_opt_lsp_modeline_progress" ]'
shell = ['sh']
disabled = false

[custom.kaklsp_modeline]
description = "Show LSP modeline information"
format = "[$output]($style)"
style = "cyan"
command = 'printf "%s" "$kak_opt_lsp_modeline"'
when = '[ -n "$kak_opt_lsp_modeline" ]'
shell = ['sh']
disabled = false
