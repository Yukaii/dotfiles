id = "kakoune-popup"
name = "Kakoune Popup"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Open Kakoune terminal commands in a native Herdr popup"
platforms = ["linux", "macos"]

[[panes]]
id = "command"
title = "Kakoune Popup"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/run.sh"']
