# vim:fileencoding=utf-8:ft=conf:foldmethod=marker

font_family        JetBrains Mono
font_size 15.0

cursor_blink_interval 0
cursor_trail 1

scrollback_lines -1
window_padding_width 10

hide_window_decorations titlebar-only
tab_bar_style custom

tab_title_template {index}

active_tab_foreground   #d3d7cf
active_tab_background   #2e3436
active_tab_font_style   normal
inactive_tab_foreground #d3d7cf
inactive_tab_background #222222
tab_bar_background      #222222
tab_bar_margin_color    #222222
inactive_text_alpha 0.5

shell_integration no-cursor


# Kanagawa Bones
color0 #1f1f28
color1 #e46a78
color2 #98bc6d
color3 #e5c283
color4 #7eb3c9
color5 #957fb8
color6 #7eb3c9
color7 #ddd8bb
color8 #3c3c51
color9 #ec818c
color10 #9ec967
color11 #f1c982
color12 #7bc2df
color13 #a98fd2
color14 #7bc2df
color15 #a8a48d
background #1f1f28
selection_foreground #1f1f28
cursor #e6e0c2
foreground #ddd8bb
selection_background #ddd8bb


shell arch -arm64 /opt/homebrew/bin/fish
editor /opt/homebrew/bin/nvim

allow_remote_control yes

macos_titlebar_color background

macos_option_as_alt yes
macos_thicken_font 0
macos_menubar_title_max_length 100

map cmd+shift+h         show_scrollback

map cmd+shift+,     move_tab_backward
map cmd+shift+.     move_tab_forward

# debug
map f1 show_kitty_env_vars

enabled_layouts splits

# ── Ghostty keybindings ported to Kitty ──────────────────────────────

# Window management
map cmd+n new_os_window
map cmd+shift+k clear_terminal reset active

# Split navigation (kitty-native, matches Ghostty goto_split)
map shift+ctrl+left  neighboring_window left
map shift+ctrl+right neighboring_window right
map shift+ctrl+up    neighboring_window up
map shift+ctrl+down  neighboring_window down

# ── Tmux passthrough (prefix = C-q / \x11) ──────────────────────────

# Tsm popup shortcuts
map ctrl+0x27 send_text all \x11'
map ctrl+alt+w send_text all \x11w
map ctrl+alt+shift+n send_text all \x11N
map ctrl+alt+shift+p send_text all \x11P

# Toggle tmux persistent bottom panel (prefix C-q + b)
map ctrl+backtick send_text all \x11b

# Pop out / kill popout tmux window
map ctrl+alt+g send_text all \x11G
map ctrl+alt+shift+g send_text all \x11g

# Tmux prev/next window
map ctrl+shift+tab send_text all \x11p
map ctrl+tab send_text all \x11n
map cmd+shift+[ send_text all \x11p
map cmd+shift+] send_text all \x11n

# Tmux session switching
map ctrl+alt+t send_text all \x11T
map ctrl+alt+r send_text all \x11r

# Keyroute tmux session slots (Ctrl+Cmd+K → prefix C-q + y)
map ctrl+cmd+k send_text all \x11y

# New tab / close in tmux (prefix C-q + c / &)
map cmd+t send_text all \x11c
map cmd+w send_text all \x11&

# Workspace navigation
map cmd+shift+up send_text all \x11\x1b[1;2D
map cmd+shift+down send_text all \x11\x1b[1;2C

# Panel navigation (sent to tmux; overrides kitty-native neighboring_window above)
map ctrl+shift+left  send_text all \x11h
map ctrl+shift+right send_text all \x11l
map ctrl+shift+up    send_text all \x11k
map ctrl+shift+down  send_text all \x11j

# Start pane selector (prefix C-q + q)
map ctrl+alt+p send_text all \x11q

# Copy mode (prefix C-q + [)
map ctrl+alt+[ send_text all \x11[

# Clear history (prefix C-q + M-l)
map ctrl+alt+k send_text all \x11\x1bl

# Horizontal split (prefix C-q + ")
map ctrl+alt+0x27 send_text all \x11"

# Vertical split (prefix C-q + |)
map ctrl+alt+/ send_text all \x11|

# Toggle zoom (prefix C-q + z)
map ctrl+alt+z send_text all \x11z

# Tmux command palette (prefix C-q + ?)
map cmd+p send_text all \x11?

# Tmux panel jump (prefix C-q + digit)
map cmd+1 send_text all \x111
map cmd+2 send_text all \x112
map cmd+3 send_text all \x113
map cmd+4 send_text all \x114
map cmd+5 send_text all \x115
map cmd+6 send_text all \x116
map cmd+7 send_text all \x117
map cmd+8 send_text all \x118
map cmd+9 send_text all \x1b[F

# Tmux panel jump with remote default prefix (C-b + digit)
map ctrl+alt+0 send_text all \x020
map ctrl+alt+1 send_text all \x021
map ctrl+alt+2 send_text all \x022
map ctrl+alt+3 send_text all \x023
map ctrl+alt+4 send_text all \x024
map ctrl+alt+5 send_text all \x025
map ctrl+alt+6 send_text all \x026
map ctrl+alt+7 send_text all \x027
map ctrl+alt+8 send_text all \x028
map ctrl+alt+9 send_text all \x1b[F

# Tmux prev/next with remote default prefix (C-b + p / n)
map ctrl+alt+left  send_text all \x02p
map ctrl+alt+right send_text all \x02n

# Herdr keybindings
map cmd+shift+n send_text all \x11N
map cmd+shift+d send_text all \x11D
